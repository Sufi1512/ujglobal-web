<!doctype html>
<html><body style="margin:0;padding:24px;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#0b1b3f">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e3e8f0;border-radius:12px;padding:24px">
<p style="margin:0 0 4px;font-size:13px;color:#4f46e5;font-weight:bold">New lead from the $source</p>
<h1 style="margin:0 0 16px;font-size:22px">$name</h1>
<table style="border-collapse:collapse;font-size:14px;margin-bottom:16px">$rows</table>
<div style="font-size:14px;line-height:1.5;padding:16px;background:#f5f7fb;border-radius:8px">$message</div>
<p style="margin:24px 0 8px"><a href="$link" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:999px;font-weight:bold;font-size:14px">Open in leads inbox</a></p>
<p style="margin:0;font-size:12px;color:#51607a">Reply to this email to answer $name directly.</p>
</div></body></html>
