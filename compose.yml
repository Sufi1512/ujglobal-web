# UJ Global, live site: the whole site behind ONE port, using your existing PostgreSQL.
#
#   docker compose up -d --build
#
# Settings come from environment variables, which hosting panels usually put in a `.env` file next to
# this one (see deploy.env.example and docs/DEPLOY-SINGLE-PORT.md). Required ones stop the deploy with
# a clear message if missing.
#
# Only the `gateway` publishes a port: PUBLIC_PORT (default 9005), on 127.0.0.1 unless PUBLIC_BIND says
# otherwise. It sends /v1/* and /health to the API and everything else to the website, on one domain.
# No Postgres container is started: the API and worker connect to DATABASE_URL. Redis runs inside this
# stack without a published port, so it can't clash with a Redis you already have.
#
# Local development uses compose.dev.yml instead: docker compose -f compose.dev.yml up --build

name: ujglobal

x-api-env: &api-env
  ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your PostgreSQL, e.g. postgresql+asyncpg://ujglobal:PASSWORD@host.docker.internal:5432/ujglobal}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (64 random characters; infra/server/gen-secrets.sh makes them)}
  IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT}
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
  CORS_ORIGINS: '["${SITE_URL:?set SITE_URL to your domain, e.g. https://ujglobal.tech}"]'
  ADMIN_BASE_URL: ${SITE_URL}
  COOKIE_SECURE: "true"
  WEB_REVALIDATE_URL: http://web:9006/api/revalidate
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  EMAIL_FROM: ${EMAIL_FROM:-UJ Global <no-reply@ujglobal.tech>}
  LEAD_ALERT_RECIPIENTS: ${LEAD_ALERT_RECIPIENTS:-[]}
  TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # 127.0.0.1 by default: only your hosting panel on this server can reach it, never the internet
    # directly (Docker-published ports skip the firewall). Set PUBLIC_BIND=0.0.0.0 only if the panel
    # connects over the network, and then allow the port from the panel's address alone.
    ports: ["${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-9005}:9005"]
    volumes:
      - ./infra/single-port/Caddyfile:/etc/caddy/Caddyfile:ro
      - gatewaydata:/data
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    logging: *logging

  web:
    build:
      context: ./apps/web
      args:
        # Same domain for site and API: the browser calls /v1/... on the site's own address.
        NEXT_PUBLIC_API_URL: ${SITE_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    image: ujglobal-web:latest
    restart: unless-stopped
    # Only what the website needs; none of the API's secrets.
    environment:
      API_INTERNAL_URL: http://api:9005
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    expose: ["9006"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9006/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  api:
    build: ./apps/api
    image: ujglobal-api:latest
    restart: unless-stopped
    environment: *api-env
    # Lets containers reach a PostgreSQL running on this server as host.docker.internal.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Brings the database schema up to date before serving, so a redeploy is all an update needs.
    command: ["sh", "-c", "alembic upgrade head && exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:9005"]
    expose: ["9005"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9005/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      redis: { condition: service_started }
    logging: *logging

  # Background jobs: lead alert emails, website refreshes after edits, nightly retention clean-up.
  worker:
    build: ./apps/api
    image: ujglobal-api:latest
    restart: unless-stopped
    environment: *api-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    # No published port: only the API and worker use it.
    logging: *logging

volumes:
  redisdata:
  gatewaydata:
