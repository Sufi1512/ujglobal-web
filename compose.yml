# Local development stack: `docker compose up --build`
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ujglobal
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  api:
    build: ./apps/api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ujglobal
      CORS_ORIGINS: '["http://localhost:3000"]'
      COOKIE_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
    volumes: ["./apps/api/app:/app/app", "./apps/api/alembic:/app/alembic"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Sends new-lead alerts (and later other background jobs). Emails land in Mailpit: http://localhost:8025
  worker:
    build: ./apps/api
    command: arq app.workers.main.WorkerSettings --watch app
    # Comes back on its own if Redis restarts; leads queued meanwhile are caught by the sweep.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ujglobal
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      LEAD_ALERT_RECIPIENTS: '["team@ujglobal.tech"]'
      ADMIN_BASE_URL: http://localhost:3000
    volumes: ["./apps/api/app:/app/app"]
    depends_on:
      api: { condition: service_started }
      mailpit: { condition: service_started }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes: ["./apps/web:/app", "/app/node_modules"]
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
