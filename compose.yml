# UJ Global, LIVE SITE. Settings come from your hosting panel's environment variables, or from a `.env`
# file next to this one (copy .env.production.example to .env and fill it in).
#
#   docker compose up -d --build
#
# Every container uses the server's own network (network_mode: host), so `localhost` in DATABASE_URL is
# this server, as for an app run without Docker. Each one listens on 127.0.0.1 only:
#   gateway  PUBLIC_BIND:PUBLIC_PORT (default 127.0.0.1:9005), the one port your panel points the domain at
#   web      127.0.0.1:9006     api  127.0.0.1:9007     redis  127.0.0.1:6380
# The gateway sends /v1/* and /health to the API and everything else to the website, on one domain.
# No Postgres container: the API and worker use your existing PostgreSQL (DATABASE_URL), and the API
# creates the database there on first start if it's missing.
# One self-contained file on purpose: hosting panels that rewrite compose files often mishandle `include`.
# The images are built from the repository root and copy in the `.env` next to this file, so the site
# also works on panels that don't pass environment variables to containers (they're built on your
# server and never pushed anywhere). Environment variables, when they do arrive, take priority.
# Needs Docker Compose 2.24 or newer. Guide: docs/DEPLOY-SINGLE-PORT.md.
#
# On your own computer use the development setup instead: docker compose -f compose.dev.yml up --build

name: ujglobal

services:
  gateway:
    # Caddy with the routing file (infra/single-port/Caddyfile) built in.
    build: { context: ., dockerfile: infra/single-port/gateway.Dockerfile }
    image: ujglobal-gateway:latest
    restart: unless-stopped
    network_mode: host
    # 127.0.0.1 by default: only your hosting panel on this server can reach it, never the internet
    # directly. Set PUBLIC_BIND=0.0.0.0 only if the panel connects over the network, and then allow the
    # port from the panel's address alone. Without these the Caddyfile's defaults apply (127.0.0.1:9005).
    environment:
      PUBLIC_BIND: ${PUBLIC_BIND:-127.0.0.1}
      PUBLIC_PORT: ${PUBLIC_PORT:-9005}
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  web:
    build:
      context: .
      dockerfile: infra/single-port/web.Dockerfile
      args:
        # Same domain for site and API: the browser calls /v1/... on the site's own address.
        NEXT_PUBLIC_API_URL: ${SITE_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    image: ujglobal-web:latest
    restart: unless-stopped
    network_mode: host
    # Only what the website needs; none of the API's secrets. Address and port are built into the image.
    environment:
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9006/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  api:
    build: { context: ., dockerfile: infra/single-port/api.Dockerfile }
    image: ujglobal-api:latest
    restart: unless-stopped
    network_mode: host
    # Also load .env directly, in case a hosting panel passes it to containers but drops `environment`.
    env_file: [{ path: .env, required: false }]
    # Written out in full (no YAML anchors): some hosting panels drop anchored blocks when they rewrite
    # the file, and the containers then start with no settings at all.
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env or your panel environment variables, e.g. postgresql+asyncpg://ujglobal:PASSWORD@localhost:5432/ujglobal}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      REDIS_URL: redis://127.0.0.1:6380/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or your panel environment variables (infra/server/gen-secrets.sh makes it)}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in .env or your panel environment variables}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env or your panel environment variables}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env or your panel environment variables}
      CORS_ORIGINS: '["${SITE_URL:?set SITE_URL in .env or your panel environment variables, e.g. https://ujglobal.tech}"]'
      ADMIN_BASE_URL: ${SITE_URL}
      COOKIE_SECURE: "true"
      WEB_REVALIDATE_URL: http://127.0.0.1:9006/api/revalidate
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      EMAIL_FROM: ${EMAIL_FROM:-UJ Global <no-reply@ujglobal.tech>}
      LEAD_ALERT_RECIPIENTS: ${LEAD_ALERT_RECIPIENTS:-[]}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9007/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      redis: { condition: service_started }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  # Background jobs: lead alert emails, website refreshes after edits, nightly retention clean-up.
  worker:
    build: { context: ., dockerfile: infra/single-port/worker.Dockerfile }
    image: ujglobal-worker:latest
    restart: unless-stopped
    network_mode: host
    # Also load .env directly, in case a hosting panel passes it to containers but drops `environment`.
    env_file: [{ path: .env, required: false }]
    # Written out in full (no YAML anchors): some hosting panels drop anchored blocks when they rewrite
    # the file, and the containers then start with no settings at all.
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env or your panel environment variables, e.g. postgresql+asyncpg://ujglobal:PASSWORD@localhost:5432/ujglobal}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      REDIS_URL: redis://127.0.0.1:6380/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or your panel environment variables (infra/server/gen-secrets.sh makes it)}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in .env or your panel environment variables}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env or your panel environment variables}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env or your panel environment variables}
      CORS_ORIGINS: '["${SITE_URL:?set SITE_URL in .env or your panel environment variables, e.g. https://ujglobal.tech}"]'
      ADMIN_BASE_URL: ${SITE_URL}
      COOKIE_SECURE: "true"
      WEB_REVALIDATE_URL: http://127.0.0.1:9006/api/revalidate
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      EMAIL_FROM: ${EMAIL_FROM:-UJ Global <no-reply@ujglobal.tech>}
      LEAD_ALERT_RECIPIENTS: ${LEAD_ALERT_RECIPIENTS:-[]}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    # 127.0.0.1:6380 (not 6379) so it can't clash with a Redis already installed on the server.
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6380", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

volumes:
  redisdata:
