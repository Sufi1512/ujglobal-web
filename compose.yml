# UJ Global, LIVE SITE. Settings: .env.production (copy .env.production.example and fill it in).
#
#   docker compose up -d --build
#
# The whole site answers on one port (9005) and uses your existing PostgreSQL; the stack itself is in
# infra/compose.live.yml. Needs Docker Compose 2.20 or newer. Guide: docs/DEPLOY-SINGLE-PORT.md.
#
# On your own computer use the development setup instead: docker compose -f compose.dev.yml up --build

name: ujglobal

include:
  - path: infra/compose.live.yml
    env_file: .env.production
