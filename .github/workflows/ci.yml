name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs get read-only access unless they ask for more (only `images` publishes).
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ujglobal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ujglobal_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Migrations apply, roll back and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts pass shellcheck
        run: shellcheck --severity=warning infra/server/*.sh
      - name: Compose files are valid
        run: |
          docker network create ujglobal-edge
          printf 'STACK=staging\nPOSTGRES_USER=u\nPOSTGRES_PASSWORD=p\n' > /tmp/app.env
          ENV_FILE=/tmp/app.env WEB_ENV_FILE=/tmp/app.env WEB_TAG=x API_TAG=x docker compose -f infra/compose.app.yml --env-file /tmp/app.env config --quiet
          sudo mkdir -p /srv/ujglobal/edge && sudo touch /srv/ujglobal/edge/.env
          docker compose -f infra/edge/compose.yml config --quiet
          # Live site: compose.yml + .env (from the example, with generated secrets)
          grep -vE '^(JWT_SECRET|IP_HASH_SALT|REVALIDATE_SECRET|MFA_ENCRYPTION_KEY)=$' .env.production.example > .env
          bash infra/server/gen-secrets.sh >> .env
          docker compose config --format json > /tmp/live.json
          # Only the gateway publishes a port (127.0.0.1:9005), the API gets the database settings, and the
          # website gets no secrets.
          jq -e '[.services[] | select(.ports) | .ports[] | "\(.host_ip):\(.published)"] == ["127.0.0.1:9005"]' /tmp/live.json
          jq -e '.services.api.environment.DATABASE_URL | startswith("postgresql+asyncpg://")' /tmp/live.json
          jq -e '.services.web.environment | has("JWT_SECRET") | not' /tmp/live.json
          jq -e '.services | has("postgres") | not' /tmp/live.json
          # Local development: compose.dev.yml + .env.local, every port bound to this computer only
          cp .env.local.example .env.local
          docker compose -f compose.dev.yml config --format json > /tmp/dev.json
          jq -e '[.services[] | select(.ports) | .ports[] | .host_ip] | all(. == "127.0.0.1")' /tmp/dev.json
      - name: Caddy config is valid
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ujglobal.tech" \
            -keyout /tmp/certs/origin.key -out /tmp/certs/origin.pem 2>/dev/null
          docker run --rm -v "$PWD/infra/edge:/etc/caddy:ro" -v /tmp/certs:/certs:ro \
            -e STAGING_USER=ci -e 'STAGING_PASSWORD_HASH=$2b$12$aSnslqsSDjaWZHsrD7NhneqovhDESi7GlBMOc5mIJNkVXHLh3.TBW' \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v "$PWD/infra/single-port:/etc/caddy:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Builds the Docker images to prove the Dockerfiles still work. Nothing is pushed anywhere: the site is
  # deployed to UJ Global's own server and hosting, not from GitHub.
  images:
    needs: [web, api, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ujglobal.tech
            NEXT_PUBLIC_SITE_URL=https://ujglobal.tech
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # The live images build from the repository root and read the .env next to compose.yml, for hosting
      # panels that don't pass environment variables to containers. Prove the API loads it from inside its
      # image (with no environment variables) and the gateway has its routing built in.
      - name: Live images read the .env built into them
        run: |
          grep -vE '^(JWT_SECRET|IP_HASH_SALT|REVALIDATE_SECRET|MFA_ENCRYPTION_KEY)=$' .env.production.example \
            | sed -e 's/^LEAD_ALERT_RECIPIENTS=.*/LEAD_ALERT_RECIPIENTS=[]/' -e 's#^SITE_URL=.*#SITE_URL=https://ci.example#' > .env
          bash infra/server/gen-secrets.sh >> .env
          chmod 600 .env  # hosting panels often save it readable by its owner only
          docker build -q -f infra/single-port/api.Dockerfile -t live-api .
          docker run --rm live-api python -c "from app.core.config import get_settings as g; s = g(); \
            assert s.environment == 'production' and s.redis_url == 'redis://redis:6379/0', s; \
            assert s.cors_origins == ['https://ci.example'] and s.admin_base_url == 'https://ci.example'; \
            assert s.database_url.startswith('postgresql+asyncpg://'); print('settings OK')"
          docker run --rm live-api sh -c 'ls -A /app/settings' | sort | tr '\n' ' ' | grep -qx '.env defaults.env '
          docker build -q -f infra/single-port/worker.Dockerfile -t live-worker .
          docker run --rm live-worker python -c "from app.core.config import get_settings as g; assert g().environment == 'production'; print('worker OK')"
          docker build -q -f infra/single-port/gateway.Dockerfile -t live-gateway .
          docker run --rm live-gateway caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
