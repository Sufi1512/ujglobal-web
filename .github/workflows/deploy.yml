# Deploys already-built images to one stack on the server over SSH. Called by ci.yml (staging, after
# every merge to main) and deploy-production.yml (production, when someone runs it).
#
# Needs these in the GitHub environment named after the stack (Settings > Environments):
#   secrets  SSH_HOST, SSH_PORT (optional, default 22), SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS
# The server side is docs/DEPLOY.md.
name: Deploy

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      web_tag:
        type: string
        required: true
      api_tag:
        type: string
        required: true
      url:
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.stack }}
      url: ${{ inputs.url }}
    # One deploy per stack at a time; a newer one waits rather than cancelling one mid-migration.
    concurrency:
      group: deploy-${{ inputs.stack }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys: the job refuses to talk to a server it doesn't recognise.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT || '22' }}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy the infra files to the server
        run: rsync -az --delete -e ssh infra/ server:/srv/ujglobal/infra/

      - name: Deploy ${{ inputs.stack }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job's own short-lived token lets the server pull the images; it's removed again afterwards.
          ssh server "docker login ghcr.io -u ${{ github.actor }} --password-stdin" <<< "$GHCR_TOKEN"
          status=0
          ssh server "/srv/ujglobal/infra/server/deploy.sh ${{ inputs.stack }} ${{ inputs.web_tag }} ${{ inputs.api_tag }}" || status=$?
          ssh server "docker logout ghcr.io" || true
          exit $status

      - name: Check the site answers through Cloudflare
        if: inputs.stack == 'production'
        run: |
          for _ in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null --max-time 15 "${{ inputs.url }}" && curl -fsS --max-time 15 https://api.ujglobal.tech/health && exit 0
            sleep 10
          done
          echo "The site isn't answering at ${{ inputs.url }}" >&2
          exit 1
